<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Direct Antiglobulin Test</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/dat.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
// Source: DAT2.pdf (The Blood Project infographic, one page). Every claim is from that page unless marked as
// teaching; the IgG orientation (Fab on the membrane, Fc outward) is standard immunology, not stated in the source.
const CHAPTER = { number: 1, title: 'The Direct Antiglobulin Test', minutes: 7, language: 'en' };

const label = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'middle', weight = 600 } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0, .5); return e;
};

const BEATS = [
  ['intro', 'The direct antiglobulin test', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'BLOOD BANK · LESSON 1', { x: 800, y: 300, size: 26, fill: DAT.red, anchor: 'middle', weight: 700 });
    T(g, 'The Direct Antiglobulin Test', { x: 800, y: 400, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = label(scene, 'what it detects · how it is done · how to read it', 800, 520, m('sub'), { size: 34, fill: COL.dim, weight: 500 });
    // a quiet row of cells under the title, coated with IgG
    const row = G(scene, { o: 0 });
    [520, 680, 840, 1000, 1160].forEach((x, i) => { const c = datCell(row, x, 700, 46); [150, 210].forEach(a => datIgG(c, a + (i % 2) * 20)); });
    show(row, .9, 1);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(row, D - .9, .8);
  }],
  ['question', 'One question', (m, D) => {
    const p = panel(0);
    label(p, 'Are the patient’s red cells coated?', 800, 150, .1, { size: 46 });
    const xs = [400, 800, 1200], y = 400, r = 92;
    const cells = xs.map(x => { const c = datCell(p, x, y, r); put(c, { o: 0, s: .9 }); tw(c, { o: 1, s: 1 }, .3, .7, out); return c; });
    // IgG
    const igg = [0, 60, 120, 180, 240, 300].map(a => datIgG(cells[0], a + 30, { o: 0 }));
    igg.forEach((e, i) => show(e, m('coat', .1 + i * .06), .4));
    label(p, 'immunoglobulin (IgG)', xs[0], 600, m('coat', .2), { fill: DAT.igg });
    // complement
    const c3 = [0, 60, 120, 180, 240, 300].map(a => datC3d(cells[1], a, { o: 0 }));
    c3.forEach((e, i) => show(e, m('comp', .1 + i * .06), .4));
    label(p, 'complement (C3d)', xs[1], 600, m('comp', .2), { fill: DAT.c3d });
    // both
    [15, 135, 255].forEach((a, i) => show(datIgG(cells[2], a, { o: 0 }), m('both', .1 + i * .08), .4));
    [75, 195, 315].forEach((a, i) => show(datC3d(cells[2], a, { o: 0 }), m('both', .15 + i * .08), .4));
    label(p, 'both', xs[2], 600, m('both', .2));
    // why it is ordered
    const why = G(p, { o: 0 });
    mk('rect', { x: 330, y: 680, width: 940, height: 110, rx: 18, fill: '#ffffff', stroke: COL.faint }, why);
    T(why, 'Ordered in a workup for hemolysis:', { x: 800, y: 724, size: 30, weight: 600, anchor: 'middle' });
    T(why, 'bound antibody and complement can lead to red cell destruction', { x: 800, y: 768, size: 28, fill: COL.dim, anchor: 'middle' });
    show(why, m('lyse'), .6);
    T(p, 'Schematic, not to scale', { x: 1560, y: 870, size: 18, fill: COL.faint, anchor: 'end' });
  }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
